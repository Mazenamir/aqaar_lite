version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aqar_lite_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aqar_lite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aqar_lite"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqar_lite_app
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/aqar_lite?schema=public"
      SESSION_SECRET: "aqar-lite-secure-production-super-secret-key-32chars"
      NODE_ENV: "production"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
